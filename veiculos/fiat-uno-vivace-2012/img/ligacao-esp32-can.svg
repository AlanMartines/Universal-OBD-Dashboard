<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-label="Cabo Y na tomada OBD: uma fêmea no ELM327 e outra no conector do ESP32; ambos falam com o celular por Bluetooth. Pino 16 passa por fusível até o conversor DC, que alimenta o VIN e o VCC do TJA1050. TX do módulo preso em 5 V. RX vai ao D21 por divisor de resistores. CANL no pino 14, CANH no 3V3 por 1 kΩ, pino 5 no terra comum e pino 6 sem ligação."><title>Ligação prevista do projeto final: ELM327 e ESP32 com TJA1050</title><style>
text{font-family:Arial,Helvetica,'DejaVu Sans',sans-serif;fill:#1f2937;font-size:15px}
.t{font-size:22px;font-weight:700}.s{font-size:14px;fill:#4b5563}
.b{fill:#f8fafc;stroke:#334155;stroke-width:2}.h{font-size:17px;font-weight:700;text-anchor:middle}
.st{font-size:13px;fill:#4b5563;text-anchor:middle}.e{text-anchor:end}.m{text-anchor:middle}
.w{fill:none;stroke-width:3.5;stroke-linecap:round}
.l{font-size:13px;text-anchor:middle;font-weight:700}
.warn{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.wt{font-size:15px;fill:#7f1d1d}
.off{font-size:14px;fill:#6b7280;font-style:italic}
</style><rect width="1000" height="860" fill="#ffffff"/><text class="t" x="30" y="40">Projeto final: ELM327 + ESP32 com TJA1050 (ligação prevista)</text><text class="s" x="30" y="63">Só o pino 14 entra na CAN. O TX preso em 5 V impede fisicamente qualquer transmissão.</text><rect class="b" x="30" y="90" width="190" height="550" rx="10"/><text class="h" x="125.0" y="118">Conector OBD</text><text class="st" x="125.0" y="138">na fêmea do cabo Y</text><rect class="b" x="400" y="90" width="220" height="150" rx="10"/><text class="h" x="510.0" y="118">Conversor DC</text><text class="st" x="510.0" y="138">regulado em 5,0 V</text><rect class="b" x="400" y="290" width="220" height="210" rx="10"/><text class="h" x="510.0" y="318">Módulo TJA1050</text><text class="st" x="510.0" y="338">sem 120 Ω</text><rect class="b" x="780" y="90" width="190" height="550" rx="10"/><text class="h" x="875.0" y="118">ESP32 DevKit V1</text><text class="e" x="210" y="175">Pino 16 (+12 V)</text><text class="e" x="210" y="220">Pino 4 (chassi)</text><text class="e" x="210" y="375">Pino 14 (CAN-L)</text><text class="e" x="210" y="585">Pino 5 (terra de sinal)</text><text class="off" x="48" y="445">Não ligar:</text><text class="off" x="48" y="467">pino 6 (CAN-H)</text><path class="w" stroke="#dc2626" d="M220 170H400"/><circle cx="220" cy="170" r="5" fill="#dc2626"/><circle cx="400" cy="170" r="5" fill="#dc2626"/><rect x="280" y="158" width="60" height="24" fill="#fffbeb" stroke="#dc2626" stroke-width="3"/><text class="l" x="310" y="150" style="fill:#dc2626;text-anchor:middle">fusível 1 A</text><path class="w" stroke="#111827" d="M220 215H400"/><circle cx="220" cy="215" r="5" fill="#111827"/><circle cx="400" cy="215" r="5" fill="#111827"/><text class="l" x="310" y="206" style="fill:#111827;text-anchor:middle">terra</text><text x="412" y="175">IN+</text><text x="412" y="220">IN−</text><text class="e" x="608" y="175">OUT+</text><text class="e" x="608" y="220">OUT−</text><path class="w" stroke="#dc2626" d="M620 170H780"/><circle cx="620" cy="170" r="5" fill="#dc2626"/><circle cx="780" cy="170" r="5" fill="#dc2626"/><text class="l" x="735" y="161" style="fill:#dc2626;text-anchor:middle">+5 V</text><path class="w" stroke="#111827" d="M620 215H780"/><circle cx="620" cy="215" r="5" fill="#111827"/><circle cx="780" cy="215" r="5" fill="#111827"/><text x="792" y="175">VIN</text><text x="792" y="220">GND</text><path class="w" stroke="#dc2626" d="M690 170V335H620"/><circle cx="690" cy="170" r="5" fill="#dc2626"/><circle cx="620" cy="335" r="5" fill="#dc2626"/><text class="e" x="608" y="340">VCC</text><path class="w" stroke="#dc2626" d="M620 375H660V335"/><circle cx="620" cy="375" r="5" fill="#dc2626"/><circle cx="660" cy="335" r="5" fill="#dc2626"/><text class="e" x="608" y="380">TX</text><text class="l" x="655" y="362" style="fill:#dc2626;text-anchor:end">trava</text><text class="e" x="608" y="420">RX</text><path class="w" stroke="#2563eb" d="M620 415H640M690 415H780"/><circle cx="620" cy="415" r="5" fill="#2563eb"/><circle cx="780" cy="415" r="5" fill="#2563eb"/><circle cx="730" cy="415" r="5" fill="#2563eb"/><rect x="640" y="403" width="50" height="24" fill="#fffbeb" stroke="#2563eb" stroke-width="3"/><text class="l" x="665" y="396" style="fill:#2563eb;text-anchor:middle">1 kΩ</text><text x="792" y="420">D21</text><path class="w" stroke="#2563eb" d="M730 415V440M730 480V500M730 540V580"/><rect x="718" y="440" width="24" height="40" fill="#fffbeb" stroke="#2563eb" stroke-width="3"/><rect x="718" y="500" width="24" height="40" fill="#fffbeb" stroke="#2563eb" stroke-width="3"/><text class="l" x="748" y="465" style="fill:#2563eb;text-anchor:start">1 kΩ</text><text class="l" x="748" y="525" style="fill:#2563eb;text-anchor:start">1 kΩ</text><text class="e" x="608" y="460">GND</text><path class="w" stroke="#111827" d="M620 455H640V580"/><circle cx="620" cy="455" r="5" fill="#111827"/><circle cx="640" cy="580" r="5" fill="#111827"/><path class="w" stroke="#111827" d="M220 580H780"/><circle cx="220" cy="580" r="5" fill="#111827"/><circle cx="780" cy="580" r="5" fill="#111827"/><circle cx="730" cy="580" r="5" fill="#111827"/><text class="l" x="480" y="571" style="fill:#111827;text-anchor:middle">terra comum (obrigatório)</text><text x="792" y="585">GND</text><path class="w" stroke="#15803d" d="M220 370H400"/><circle cx="220" cy="370" r="5" fill="#15803d"/><circle cx="400" cy="370" r="5" fill="#15803d"/><text class="l" x="310" y="361" style="fill:#15803d;text-anchor:middle">CAN-L</text><text x="412" y="375">CANL</text><text x="412" y="445">CANH</text><path class="w" stroke="#d97706" d="M400 440H340V465M340 515V620H780"/><circle cx="400" cy="440" r="5" fill="#d97706"/><circle cx="780" cy="620" r="5" fill="#d97706"/><rect x="328" y="465" width="24" height="50" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text class="l" x="320" y="495" style="fill:#d97706;text-anchor:end">1 kΩ</text><text x="792" y="625">3V3</text><text x="792" y="490">D22</text><text class="off" x="830" y="490">sem ligação</text><rect class="b" x="30" y="665" width="190" height="70" rx="10"/><text class="h" x="125.0" y="693">Cabo Y OBD2</text><text class="st" x="125.0" y="713">na tomada OBD do carro</text><rect class="b" x="400" y="665" width="220" height="70" rx="10"/><text class="h" x="510.0" y="693">ELM327</text><text class="st" x="510.0" y="713">motor: linha K, pino 7</text><rect class="b" x="780" y="665" width="190" height="70" rx="10"/><text class="h" x="875.0" y="693">Celular</text><text class="st" x="875.0" y="713">Universal OBD</text><path class="w" stroke="#475569" d="M125 665V640"/><path class="w" stroke="#475569" d="M220 700H400"/><text class="l" x="310" y="691" style="fill:#475569;text-anchor:middle">fêmea do Y</text><path class="w" stroke="#2563eb" stroke-dasharray="3 9" d="M620 700H780"/><text class="l" x="700" y="691" style="fill:#2563eb;text-anchor:middle">Bluetooth</text><path class="w" stroke="#2563eb" stroke-dasharray="3 9" d="M875 640V665"/><text class="l" x="885" y="657" style="fill:#2563eb;text-anchor:start">Bluetooth</text><rect class="warn" x="30" y="755" width="940" height="90" rx="8"/><text class="wt" x="48" y="783">Regule o conversor em 5,0 V com o multímetro antes de ligar. Nunca ligue 12 V direto no ESP32.</text><text class="wt" x="48" y="807">O D21 aceita só 3,3 V: nunca ligue o RX direto nele. Meça o D21 depois de montar (até 3,4 V, estável).</text><text class="wt" x="48" y="831">O pino 16 tem energia com o carro desligado: desconecte se o carro for ficar parado.</text></svg>
