<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 815" width="1000" height="815" role="img" aria-label="Cabo Y na tomada OBD: uma fêmea no ELM327 e outra no pigtail do ESP32; ambos falam com o celular por Bluetooth. Pinos 16 e 4 no conversor DC, que alimenta o VIN; pinos 6 e 14 no transceptor; CRX no D21; CTX fixo em 3,3 V; pino 5 no terra comum."><title>Ligação prevista do projeto final: ELM327 e ESP32 com SN65HVD230</title><style>
text{font-family:Arial,Helvetica,'DejaVu Sans',sans-serif;fill:#1f2937;font-size:15px}
.t{font-size:22px;font-weight:700}.s{font-size:14px;fill:#4b5563}
.b{fill:#f8fafc;stroke:#334155;stroke-width:2}.h{font-size:17px;font-weight:700;text-anchor:middle}
.st{font-size:13px;fill:#4b5563;text-anchor:middle}.e{text-anchor:end}.m{text-anchor:middle}
.w{fill:none;stroke-width:3.5;stroke-linecap:round}
.l{font-size:13px;text-anchor:middle;font-weight:700}
.warn{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.wt{font-size:15px;fill:#7f1d1d}
.off{font-size:14px;fill:#6b7280;font-style:italic}
</style><rect width="1000" height="815" fill="#ffffff"/><text class="t" x="30" y="40">Projeto final: ELM327 + ESP32 com SN65HVD230 (ligação prevista)</text><text class="s" x="30" y="63">O CTX preso em 3,3 V impede fisicamente qualquer transmissão. O transceptor final depende dos testes com o Arduino.</text><rect class="b" x="30" y="90" width="190" height="500" rx="10"/><text class="h" x="125.0" y="118">Pigtail OBD</text><text class="st" x="125.0" y="138">na fêmea do cabo Y</text><rect class="b" x="400" y="90" width="220" height="150" rx="10"/><text class="h" x="510.0" y="118">Conversor DC</text><text class="st" x="510.0" y="138">regulado em 5,0 V</text><rect class="b" x="400" y="290" width="220" height="190" rx="10"/><text class="h" x="510.0" y="318">SN65HVD230</text><text class="st" x="510.0" y="338">sem o resistor de 120 Ω</text><rect class="b" x="780" y="90" width="190" height="500" rx="10"/><text class="h" x="875.0" y="118">ESP32 DevKit V1</text><text class="e" x="210" y="175">Pino 16 (+12 V)</text><text class="e" x="210" y="220">Pino 4 (chassi)</text><text class="e" x="210" y="375">Pino 6 (CAN-H)</text><text class="e" x="210" y="435">Pino 14 (CAN-L)</text><text class="e" x="210" y="545">Pino 5 (terra de sinal)</text><path class="w" stroke="#dc2626" d="M220 170H400"/><circle cx="220" cy="170" r="5" fill="#dc2626"/><circle cx="400" cy="170" r="5" fill="#dc2626"/><text class="l" fill="#dc2626" style="fill:#dc2626" x="310.0" y="161">+12 V</text><path class="w" stroke="#111827" d="M220 215H400"/><circle cx="220" cy="215" r="5" fill="#111827"/><circle cx="400" cy="215" r="5" fill="#111827"/><text class="l" fill="#111827" style="fill:#111827" x="310.0" y="206">terra</text><text x="412" y="175">IN+</text><text x="412" y="220">IN-</text><text class="e" x="608" y="175">OUT+</text><text class="e" x="608" y="220">OUT-</text><path class="w" stroke="#dc2626" d="M620 170H780"/><circle cx="620" cy="170" r="5" fill="#dc2626"/><circle cx="780" cy="170" r="5" fill="#dc2626"/><text class="l" fill="#dc2626" style="fill:#dc2626" x="700.0" y="161">+5 V</text><path class="w" stroke="#111827" d="M620 215H780"/><circle cx="620" cy="215" r="5" fill="#111827"/><circle cx="780" cy="215" r="5" fill="#111827"/><text x="792" y="175">VIN</text><text x="792" y="220">GND</text><path class="w" stroke="#d97706" d="M220 370H400"/><circle cx="220" cy="370" r="5" fill="#d97706"/><circle cx="400" cy="370" r="5" fill="#d97706"/><text class="l" fill="#d97706" style="fill:#d97706" x="310.0" y="361">CAN-H</text><path class="w" stroke="#15803d" d="M220 430H400"/><circle cx="220" cy="430" r="5" fill="#15803d"/><circle cx="400" cy="430" r="5" fill="#15803d"/><text class="l" fill="#15803d" style="fill:#15803d" x="310.0" y="421">CAN-L</text><text x="412" y="375">CANH</text><text x="412" y="435">CANL</text><text class="e" x="608" y="365">3V3</text><text class="e" x="608" y="410">CTX (D)</text><text class="e" x="608" y="455">CRX (R)</text><path class="w" stroke="#dc2626" d="M620 360H780"/><circle cx="620" cy="360" r="5" fill="#dc2626"/><circle cx="780" cy="360" r="5" fill="#dc2626"/><text class="l" fill="#dc2626" style="fill:#dc2626" x="700.0" y="351">3,3 V</text><text x="792" y="365">3V3</text><path class="w" stroke="#dc2626" d="M620 405H680V360"/><circle cx="620" cy="405" r="5" fill="#dc2626"/><circle cx="680" cy="360" r="5" fill="#dc2626"/><text class="l" style="fill:#dc2626" x="720" y="410">trava</text><path class="w" stroke="#2563eb" d="M620 450H780"/><circle cx="620" cy="450" r="5" fill="#2563eb"/><circle cx="780" cy="450" r="5" fill="#2563eb"/><text class="l" fill="#2563eb" style="fill:#2563eb" x="700.0" y="441">recepção</text><text x="792" y="455">D21</text><text class="l" style="fill:#111827" x="360" y="531">terra comum</text><text x="792" y="500">D22</text><text class="off" x="680" y="500">sem ligação</text><path class="w" stroke="#111827" d="M220 540H780"/><circle cx="220" cy="540" r="5" fill="#111827"/><circle cx="780" cy="540" r="5" fill="#111827"/><text x="792" y="545">GND</text><path class="w" stroke="#111827" d="M510 540V480"/><circle cx="510" cy="540" r="5" fill="#111827"/><circle cx="510" cy="480" r="5" fill="#111827"/><text x="510" y="472" class="m">GND</text><rect class="b" x="30" y="625" width="190" height="70" rx="10"/><text class="h" x="125.0" y="653">Cabo Y OBD2</text><text class="st" x="125.0" y="673">na tomada OBD do carro</text><rect class="b" x="400" y="625" width="220" height="70" rx="10"/><text class="h" x="510.0" y="653">ELM327</text><text class="st" x="510.0" y="673">motor: linha K, pino 7</text><rect class="b" x="780" y="625" width="190" height="70" rx="10"/><text class="h" x="875.0" y="653">Celular</text><text class="st" x="875.0" y="673">Universal OBD</text><path class="w" stroke="#475569" d="M125 625V590"/><path class="w" stroke="#475569" d="M220 660H400"/><text class="l" style="fill:#475569" x="310" y="651">fêmea do Y</text><path class="w" stroke="#2563eb" stroke-dasharray="3 9" d="M620 660H780"/><text class="l" style="fill:#2563eb" x="700" y="651">Bluetooth</text><path class="w" stroke="#2563eb" stroke-dasharray="3 9" d="M875 590V625"/><text class="l" style="fill:#2563eb;text-anchor:start" x="885" y="612">Bluetooth</text><rect class="warn" x="30" y="715" width="940" height="90" rx="8"/><text class="wt" x="48" y="743">Regule o conversor em 5,0 V com o multímetro antes de ligar. Nunca ligue 12 V direto no ESP32.</text><text class="wt" x="48" y="767">Os pinos do ESP32 aceitam só 3,3 V: nada do OBD vai direto neles.</text><text class="wt" x="48" y="791">O pino 16 tem energia com o carro desligado: desconecte se o carro for ficar parado por dias.</text></svg>
