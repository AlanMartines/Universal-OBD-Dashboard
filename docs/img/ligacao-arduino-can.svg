<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="Pino 6 no CANH, pino 14 no CANL e pino 5 no GND livre do Arduino; módulo ligado ao Arduino por 5V, GND, D10, D11, D12 e D13."><title>Ligação do Arduino com MCP2515 ao conector OBD</title><style>
text{font-family:Arial,Helvetica,'DejaVu Sans',sans-serif;fill:#1f2937;font-size:15px}
.t{font-size:22px;font-weight:700}.s{font-size:14px;fill:#4b5563}
.b{fill:#f8fafc;stroke:#334155;stroke-width:2}.h{font-size:17px;font-weight:700;text-anchor:middle}
.st{font-size:13px;fill:#4b5563;text-anchor:middle}.e{text-anchor:end}.m{text-anchor:middle}
.w{fill:none;stroke-width:3.5;stroke-linecap:round}
.l{font-size:13px;text-anchor:middle;font-weight:700}
.warn{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.wt{font-size:15px;fill:#7f1d1d}
.off{font-size:14px;fill:#6b7280;font-style:italic}
</style><rect width="1000" height="720" fill="#ffffff"/><text class="t" x="30" y="40">Escuta CAN: Arduino Uno + MCP2515</text><text class="s" x="30" y="63">Só escuta (listen-only). Alimentação só pelo USB.</text><rect class="b" x="30" y="90" width="190" height="450" rx="10"/><text class="h" x="125.0" y="118">Conector OBD</text><text class="st" x="125.0" y="138">do carro</text><rect class="b" x="390" y="90" width="200" height="380" rx="10"/><text class="h" x="490.0" y="118">Módulo MCP2515</text><text class="st" x="490.0" y="138">cristal de 8 MHz</text><rect class="b" x="770" y="90" width="200" height="450" rx="10"/><text class="h" x="870.0" y="118">Arduino Uno</text><rect class="b" x="770" y="565" width="200" height="60" rx="10"/><text class="h" x="870.0" y="593">Notebook</text><path class="w" stroke="#475569" d="M870 540V565"/><text class="s" x="882" y="557">USB</text><text class="e" x="210" y="215">Pino 6 (CAN-H)</text><text class="e" x="210" y="295">Pino 14 (CAN-L)</text><text class="e" x="210" y="505">Pino 5 (terra de sinal)</text><path class="w" stroke="#d97706" d="M220 210H390"/><circle cx="220" cy="210" r="5" fill="#d97706"/><circle cx="390" cy="210" r="5" fill="#d97706"/><text class="l" fill="#d97706" style="fill:#d97706" x="305.0" y="201">CAN-H</text><path class="w" stroke="#15803d" d="M220 290H390"/><circle cx="220" cy="290" r="5" fill="#15803d"/><circle cx="390" cy="290" r="5" fill="#15803d"/><text class="l" fill="#15803d" style="fill:#15803d" x="305.0" y="281">CAN-L</text><text x="402" y="215">CANH</text><text x="402" y="295">CANL</text><text class="off" x="48" y="390">Não ligar:</text><text class="off" x="48" y="412">pino 16 (+12 V)</text><text class="off" x="48" y="434">pino 4 (chassi)</text><text class="e" x="578" y="175">VCC</text><text x="782" y="175">5V</text><path class="w" stroke="#dc2626" d="M590 170H770"/><circle cx="590" cy="170" r="5" fill="#dc2626"/><circle cx="770" cy="170" r="5" fill="#dc2626"/><text class="e" x="578" y="215">GND</text><text x="782" y="215">GND (1)</text><path class="w" stroke="#111827" d="M590 210H770"/><circle cx="590" cy="210" r="5" fill="#111827"/><circle cx="770" cy="210" r="5" fill="#111827"/><text class="e" x="578" y="255">CS</text><text x="782" y="255">D10</text><path class="w" stroke="#2563eb" d="M590 250H770"/><circle cx="590" cy="250" r="5" fill="#2563eb"/><circle cx="770" cy="250" r="5" fill="#2563eb"/><text class="e" x="578" y="295">SI</text><text x="782" y="295">D11</text><path class="w" stroke="#2563eb" d="M590 290H770"/><circle cx="590" cy="290" r="5" fill="#2563eb"/><circle cx="770" cy="290" r="5" fill="#2563eb"/><text class="e" x="578" y="335">SO</text><text x="782" y="335">D12</text><path class="w" stroke="#7c3aed" d="M590 330H770"/><circle cx="590" cy="330" r="5" fill="#7c3aed"/><circle cx="770" cy="330" r="5" fill="#7c3aed"/><text class="e" x="578" y="375">SCK</text><text x="782" y="375">D13</text><path class="w" stroke="#7c3aed" d="M590 370H770"/><circle cx="590" cy="370" r="5" fill="#7c3aed"/><circle cx="770" cy="370" r="5" fill="#7c3aed"/><text class="e" x="578" y="425">INT</text><text class="off" x="602" y="425">sem ligação</text><path class="w" stroke="#111827" d="M220 500H770"/><circle cx="220" cy="500" r="5" fill="#111827"/><circle cx="770" cy="500" r="5" fill="#111827"/><text class="l" fill="#111827" style="fill:#111827" x="495.0" y="491">terra comum (obrigatório)</text><text x="782" y="505">GND (2)</text><rect class="warn" x="30" y="640" width="940" height="66" rx="8"/><text class="wt" x="48" y="668">Tire o jumper de 120 Ω do módulo antes de ligar.</text><text class="wt" x="48" y="692">Ordem: fios nos pinos 6, 14 e 5 e, por último, o USB. Para desligar, comece pelo USB.</text></svg>
