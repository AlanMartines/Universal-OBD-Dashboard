name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Cache de dependências e da distribuição do Gradle; o Android SDK já vem no runner.
      - uses: gradle/actions/setup-gradle@v6

      - name: Testes de unidade, lint e APK de debug
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      # Ferramenta de recálculo (Python, só biblioteca padrão), incluindo a paridade do consumo com o app
      - name: Testes da ferramenta trip-report
        run: python3 -I -m unittest discover -s tools/trip-report -p 'test_*.py' -v

      - name: Testes da ferramenta can-capture
        run: python3 -I -m unittest discover -s tools/can-capture -p 'test_*.py' -v

      - name: Relatórios de teste e lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK de debug
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # O APK de release passa pelo R8. Este job instala a variante "smoke" (release + chave de debug)
  # num emulador e confere que o app abre, carrega o painel e não trava nos primeiros segundos.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: APK otimizado (R8)
        run: ./gradlew :app:assembleSmoke --console=plain

      - name: Liberar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/smoke/app-smoke.apk
            adb logcat -c
            adb shell am start -W -n com.universal.obddashboard/.MainActivity
            sleep 15
            adb shell pidof com.universal.obddashboard
            adb logcat -d -s AndroidRuntime:E > crash.txt || true
            if grep -q "com.universal.obddashboard" crash.txt; then cat crash.txt; exit 1; fi
