# Avisos semanais de atualização. Bibliotecas que exigem SDK de compilação ou Kotlin mais novos que os
# do projeto (ver CHANGELOG) aparecem como PR e são avaliadas antes do merge.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
