<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" width="1000" height="1320" role="img" aria-label="Tomada OBD2 do Fiat Uno Vivace 2012. No carro ela fica invertida: pino 1 embaixo, à direita, contando da direita para a esquerda (parte larga embaixo). Pino 4 terra do chassi, 5 terra de sinal, 6 CAN-H da carroceria, 7 linha K da injeção IAW 7GF, 14 CAN-L da carroceria a 50 kbps, 16 +12 V. O ELM327 usa a linha K (KWP rápido); a placa do ESP32 usa 16 pelo fusível, 4 e 5 de terra e 14 em listen-only, com o 6 isolado."><title>Pinagem OBD2 do Fiat Uno Vivace 2012</title><style>
