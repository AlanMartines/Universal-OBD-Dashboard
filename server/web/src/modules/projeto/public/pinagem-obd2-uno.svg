<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" width="1000" height="1010" role="img" aria-label="Tomada OBD2 do Fiat Uno Vivace 2012 vista de frente. Pino 4 terra do chassi, 5 terra de sinal, 6 CAN-H da carroceria, 7 linha K da injeção IAW 7GF, 14 CAN-L da carroceria a 50 kbps, 16 +12 V. O ELM327 usa a linha K (KWP rápido); a placa do ESP32 usa 16 pelo fusível, 4 e 5 de terra e 14 em listen-only, com o 6 isolado."><title>Pinagem OBD2 do Fiat Uno Vivace 2012</title><style>
text{font-family:Arial,Helvetica,'DejaVu Sans',sans-serif;fill:#1f2937;font-size:15px}
.t{font-size:22px;font-weight:700}.s{font-size:14px;fill:#4b5563}.m{text-anchor:middle}.e{text-anchor:end}
.n{font-size:17px;font-weight:700;text-anchor:middle;fill:#111827}.nl{font-size:17px;font-weight:700;text-anchor:middle;fill:#ffffff}
.lb{font-size:15px;font-weight:700}.h{font-size:16px;font-weight:700;text-anchor:middle}
.mini{font-size:10px;font-weight:700;text-anchor:middle;fill:#111827}.minil{font-size:10px;font-weight:700;text-anchor:middle;fill:#fff}
.b{fill:#f8fafc;stroke:#334155;stroke-width:2}
</style><rect width="1000" height="1010" fill="#ffffff"/><text x="40" y="44" class="t">Fiat Uno Vivace 2012: o que tem em cada pino</text><text x="40" y="70" class="s">Tomada vista de frente. Pinos 6 e 14 medidos no carro e 7 pelo manual Mecânica 2000; os demais não são usados pelo projeto.</text><path d="M220.0,325.0 L780.0,325.0 L740.0,495.0 L260.0,495.0 Z" fill="#111827" stroke="#111827" stroke-width="14.0" stroke-linejoin="round"/><rect x="270.0" y="398.0" width="460.0" height="24.0" fill="#f8fafc"/><rect x="270.0" y="341.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="290.0" y="371.0" class="n">1</text><rect x="330.0" y="341.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="350.0" y="371.0" class="n">2</text><rect x="390.0" y="341.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="410.0" y="371.0" class="n">3</text><rect x="450.0" y="341.0" width="40.0" height="48.0" rx="3.0" fill="#475569" stroke="#475569" stroke-width="2.0"/><text x="470.0" y="371.0" class="nl">4</text><rect x="510.0" y="341.0" width="40.0" height="48.0" rx="3.0" fill="#475569" stroke="#475569" stroke-width="2.0"/><text x="530.0" y="371.0" class="nl">5</text><rect x="570.0" y="341.0" width="40.0" height="48.0" rx="3.0" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2.0"/><text x="590.0" y="371.0" class="nl">6</text><rect x="630.0" y="341.0" width="40.0" height="48.0" rx="3.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="2.0"/><text x="650.0" y="371.0" class="nl">7</text><rect x="690.0" y="341.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="710.0" y="371.0" class="n">8</text><rect x="270.0" y="431.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="290.0" y="461.0" class="n">9</text><rect x="330.0" y="431.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="350.0" y="461.0" class="n">10</text><rect x="390.0" y="431.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="410.0" y="461.0" class="n">11</text><rect x="450.0" y="431.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="470.0" y="461.0" class="n">12</text><rect x="510.0" y="431.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="530.0" y="461.0" class="n">13</text><rect x="570.0" y="431.0" width="40.0" height="48.0" rx="3.0" fill="#0e7490" stroke="#0e7490" stroke-width="2.0"/><text x="590.0" y="461.0" class="nl">14</text><rect x="630.0" y="431.0" width="40.0" height="48.0" rx="3.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/><text x="650.0" y="461.0" class="n">15</text><rect x="690.0" y="431.0" width="40.0" height="48.0" rx="3.0" fill="#b91c1c" stroke="#b91c1c" stroke-width="2.0"/><text x="710.0" y="461.0" class="nl">16</text><line x1="470.0" y1="341.0" x2="470.0" y2="260.0" stroke="#475569" stroke-width="3.5"/><path d="M463.0,270.0 L470.0,258.0 L477.0,270.0 Z" fill="#475569"/><text x="474.0" y="250.0" class="lb" fill="#475569" style="fill:#475569" transform="rotate(-45 474.0 250.0)">Terra do chassi</text><line x1="530.0" y1="341.0" x2="530.0" y2="260.0" stroke="#475569" stroke-width="3.5"/><path d="M523.0,270.0 L530.0,258.0 L537.0,270.0 Z" fill="#475569"/><text x="534.0" y="250.0" class="lb" fill="#475569" style="fill:#475569" transform="rotate(-45 534.0 250.0)">Terra de sinal</text><line x1="590.0" y1="341.0" x2="590.0" y2="260.0" stroke="#1d4ed8" stroke-width="3.5"/><path d="M583.0,270.0 L590.0,258.0 L597.0,270.0 Z" fill="#1d4ed8"/><text x="594.0" y="250.0" class="lb" fill="#1d4ed8" style="fill:#1d4ed8" transform="rotate(-45 594.0 250.0)">CAN-H da carroceria (≈ 0 V)</text><line x1="650.0" y1="341.0" x2="650.0" y2="260.0" stroke="#7c3aed" stroke-width="3.5"/><path d="M643.0,270.0 L650.0,258.0 L657.0,270.0 Z" fill="#7c3aed"/><text x="654.0" y="250.0" class="lb" fill="#7c3aed" style="fill:#7c3aed" transform="rotate(-45 654.0 250.0)">Linha K → injeção IAW 7GF</text><line x1="590.0" y1="479.0" x2="590.0" y2="560.0" stroke="#0e7490" stroke-width="3.5"/><path d="M583.0,550.0 L590.0,562.0 L597.0,550.0 Z" fill="#0e7490"/><text x="586.0" y="574.0" class="lb e" style="fill:#0e7490" transform="rotate(-45 586.0 574.0)">CAN-L da carroceria, 50 kbps</text><line x1="710.0" y1="479.0" x2="710.0" y2="560.0" stroke="#b91c1c" stroke-width="3.5"/><path d="M703.0,550.0 L710.0,562.0 L717.0,550.0 Z" fill="#b91c1c"/><text x="706.0" y="574.0" class="lb e" style="fill:#b91c1c" transform="rotate(-45 706.0 574.0)">+12 V da bateria</text><rect x="40" y="745" width="450" height="200" rx="10" class="b"/><text x="60" y="779" class="lb">ELM327 (consultas OBD)</text><text x="60" y="817">Numa das fêmeas do cabo Y.</text><text x="60" y="847">Fala com a injeção pela linha K, pino 7:</text><text x="60" y="877">ISO 14230-4 KWP rápido (ATSP5).</text><text x="60" y="907">Usa também 4, 5 e 16.</text><rect x="510" y="745" width="450" height="200" rx="10" class="b"/><text x="530" y="779" class="lb">Placa do ESP32 (só escuta)</text><text x="530" y="817">Pino 16: +12 V, pelo fusível de 1,5 A.</text><text x="530" y="847">Pinos 4 e 5: terra.</text><text x="530" y="877">Pino 14: CAN-L, recebido em listen-only.</text><text x="530" y="907">Pino 6 fica isolado (só o 14 basta).</text><text x="40" y="986" class="s">Nada é enviado à rede CAN: o ESP32 só escuta, e o ELM327 só faz consultas de diagnóstico.</text></svg>
