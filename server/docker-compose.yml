name: obd-telemetry

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-obd}
      POSTGRES_USER: ${DB_OWNER:-obd_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      APP_DB_USER: ${APP_DB_USER:-obd_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Sem "ports": o banco só existe na rede "backend", onde apenas a API entra.
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER:-obd_owner} -d ${DB_NAME:-obd}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  api:
    <<: *hardening
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-obd_app}:${APP_DB_PASSWORD}@db:5432/${DB_NAME:-obd}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-28472}
      TRUST_PROXY: ${TRUST_PROXY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?defina TOTP_ENCRYPTION_KEY no .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SIGNUP_DEFAULT: ${SIGNUP_DEFAULT:-closed}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER:-10}
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-7}
      RATE_LIMIT_FACTOR: ${RATE_LIMIT_FACTOR:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      MAPAS_URL: ${MAPAS_URL:-http://mapas:28473}
    networks: [backend, app, routing, mapas]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${API_PORT:-28472}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    <<: *hardening
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:${API_PORT:-28472}
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      WEB_HOST: ${WEB_HOST:-0.0.0.0}
      WEB_PORT: ${WEB_PORT:-28471}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      FORM_SECRET: ${FORM_SECRET:?defina FORM_SECRET no .env}
      # Só na homologação (acesso por http://localhost no túnel SSH): cookie sem o Secure.
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-false}
      # Recusa senha nova que aparece em vazamentos (Have I Been Pwned; só 5 caracteres do hash saem). false desliga.
      PWNED_CHECK: ${PWNED_CHECK:-true}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-7}
      RATE_LIMIT_FACTOR: ${RATE_LIMIT_FACTOR:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Única porta publicada, em HTTP: o HTTPS fica no proxy reverso à frente.
    # IP e porta vêm do .env (HTTP_BIND e HTTP_PORT).
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-28470}:${WEB_PORT:-28471}"
    volumes:
      - ${MAP_DATA_DIR:-./data/maps}:/app/maps:ro
    # A web não entra na rede "backend": não alcança o banco.
    networks: [edge, app]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${WEB_PORT:-28471}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Encaixe do percurso nas ruas. Fica sempre ligado, mas sem mapa não carrega nada (quase não gasta
  # memória) e o painel mostra o traço do GPS. O vigia sobe o OSRM com o mapa escolhido na página Mapas
  # do painel e troca de mapa sem reiniciar o contêiner. Só a API fala com ele, por rede interna.
  # Usa a mesma imagem do serviço "mapas" (OSRM v26 com os pacotes do Alpine atualizados), sem usuário
  # root; a imagem oficial do OSRM tem falhas conhecidas nos pacotes do sistema.
  osrm:
    <<: *hardening
    build: ./mapas
    command: ["sh", "/vigia.sh"]
    healthcheck:
      disable: true
    volumes:
      - ${OSRM_DATA_DIR:-./data/osrm}:/data:ro
      - ./mapas/osrm-vigia.sh:/vigia.sh:ro
    networks: [routing]
    read_only: true
    cap_drop: [ALL]
    pids_limit: 64
    # Com o Brasil inteiro, uns 9 GB; uma região ou um estado, bem menos.
    mem_limit: ${OSRM_MEM:-12g}

  # Baixa e prepara os mapas pedidos na página Mapas do painel (mapa base e encaixe), de qualquer área do
  # mundo do catálogo da Geofabrik. Sem acesso ao Docker: só grava nas duas pastas dos mapas. Recebe
  # pedidos só da API (rede interna "mapas") e é o único com saída para a internet, para baixar das
  # fontes públicas (a lista de servidores permitidos fica no código).
  mapas:
    <<: *hardening
    build: ./mapas
    environment:
      MAP_MAXZOOM: ${MAP_MAXZOOM:-15}
    volumes:
      - ${MAP_DATA_DIR:-./data/maps}:/maps
      - ${OSRM_DATA_DIR:-./data/osrm}:/osrm
    networks: [mapas, download]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    pids_limit: 256
    # Processar o encaixe pede mais memória que servi-lo; áreas grandes podem precisar de mais.
    mem_limit: ${MAPAS_MEM:-16g}

  # Tarefas periódicas isoladas: se parar, API e painel seguem funcionando.
  worker:
    <<: *hardening
    build: ./api
    command: ["node", "src/worker.js"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-obd_app}:${APP_DB_PASSWORD}@db:5432/${DB_NAME:-obd}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      PURGE_INTERVAL_MINUTES: ${PURGE_INTERVAL_MINUTES:-60}
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=4m
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');const t=Number(f.readFileSync('/tmp/worker-alive','utf8'));process.exit(Date.now()-t<3*${PURGE_INTERVAL_MINUTES:-60}*60000?0:1)"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  # Único serviço com saída para o SMTP. Se parar, só o envio de e-mails fica pendente.
  mailer:
    <<: *hardening
    build: ./api
    command: ["node", "src/mailer.js"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-obd_app}:${APP_DB_PASSWORD}@db:5432/${DB_NAME:-obd}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Telemetria OBD}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
    networks: [backend, mail]
    read_only: true
    tmpfs:
      - /tmp:size=4m
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m

networks:
  mail:
  # Só a web fica na rede com saída; API e banco ficam em redes internas.
  edge:
  app:
    internal: true
  backend:
    internal: true
  # Faixa fixa: a escolhida pelo Docker caiu numa faixa com regras antigas de firewall de outra rede.
  # Pedidos da API ao contêiner "mapas"; e a saída dele para baixar os mapas.
  mapas:
    internal: true
  download:
  routing:
    internal: true
    ipam:
      config:
        - subnet: ${ROUTING_SUBNET:-10.88.0.0/24}   # a homologação usa outra faixa

volumes:
  db-data:
